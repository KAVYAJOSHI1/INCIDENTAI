services:
  db:
    image: pgvector/pgvector:pg16
    container_name: incidentai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidentai
      POSTGRES_PASSWORD: incidentai
      POSTGRES_DB: incidentai
    ports:
      - "5436:5432"
    volumes:
      - incidentai-db-data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentai -d incidentai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  incidentai-db-data:
